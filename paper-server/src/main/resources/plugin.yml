name: FantasyEdit
version: '${version}'
main: com.fantasy.edit.paper.FantasyEditPlugin
api-version: '26.3'
authors: [ lively-Studio ]
description: Fantasy:EDIT 服务端：加载虚空造物 JSON 定义并发放自定义物品。
website: https://fantasy.example

commands:
  fantasyedit:
    description: Fantasy:EDIT 管理指令
    usage: /fantasyedit <reload|list|behaviors|build|undo|redo|give>
    aliases: [ fedit, fe ]
    permission: fantasyedit.admin

permissions:
  fantasyedit.admin:
    description: 允许使用 Fantasy:EDIT 管理指令
    default: op
  fantasyedit.build:
    description: 允许客户端向服务端提交世界快速搭建操作
    default: op
