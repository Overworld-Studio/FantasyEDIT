name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build both modules
        run: ./gradlew build --stacktrace

      - name: Upload Fabric client jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-edit-fabric
          path: fabric-client/build/libs/*.jar
          if-no-files-found: warn

      - name: Upload Paper plugin jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-edit-paper
          path: paper-server/build/libs/*.jar
          if-no-files-found: warn
